services:
  postgres:
    image: postgres:16-alpine
    container_name: disagro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: disagro_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: disagro-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:admin@postgres:5432/disagro_db
      JWT_SECRET: cambia-esto-en-produccion-min-32-chars
      PORT: 3000
      FRONTEND_URL: http://localhost:8081,http://localhost:5173,http://localhost:8080
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:3000/api
    container_name: disagro-frontend
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  postgres_data: